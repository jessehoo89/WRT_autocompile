name: Debug single package build
run-name: Debug pkg - ${{ inputs.model }}

on:
  workflow_dispatch:
    inputs:
      model:
        required: true
        description: Device Model
        type: choice
        default: zn_m2_immwrt_nowifi_kmod
        options:
          - zn_m2_immwrt_nowifi_kmod
          - zn_m2_immwrt
          - jdcloud_ipq60xx_immwrt_kmod
      target:
        required: true
        description: make target (e.g. package/qca-nss/qca-nss-ecm/compile)
        type: string
        default: package/qca-nss/qca-nss-ecm/compile

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - name: Build System Setup
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -yqq install dos2unix libfuse-dev

      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Pre Clone
        run: ./wrt_core/pre_clone_action.sh ${{ inputs.model }}

      - name: Cache Dependencies
        uses: actions/cache@v5.0.2
        with:
          path: |
            ./action_build/.ccache
            ./action_build/staging_dir
          key: ${{ runner.os }}-v2-${{ hashFiles('**/repo_flag') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-v2-${{ hashFiles('**/repo_flag') }}-

      - name: Refresh the cache
        run: |
          if [ -d "./action_build/staging_dir" ]; then
            find "./action_build/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
                find "$dir" -type f -exec touch {} +
            done
          fi

      - name: Prepare build tree (prep only)
        run: ./build.sh ${{ inputs.model }} debug

      - name: Build target verbosely
        run: |
          set -o pipefail
          cd action_build
          echo "target: ${{ inputs.target }}"
          if make ${{ inputs.target }} V=s 2>&1 | tee /tmp/pkg.log; then
            echo "===== OK ====="
          else
            echo "===== 失败，日志尾部 200 行 ====="
            tail -n 200 /tmp/pkg.log
            echo "===== logs 尾部 ====="
            for f in $(ls -t logs/package/*/*/*.txt 2>/dev/null | head -3); do
              echo "----- $f -----"; tail -n 80 "$f"
            done
            exit 1
          fi
